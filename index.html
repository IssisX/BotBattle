<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Forge & Fight</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; height: 100vh; overflow: hidden; }
        h1 { text-align: center; margin-top: 10px; margin-bottom: 10px; }
        #game-container { display: flex; width: 95%; max-width: 1200px; height: 85vh; border: 1px solid #ccc; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #builder-mode, #battle-mode { display: flex; width: 100%; height: 100%; }
        #component-palette { width: 20%; min-width: 150px; height: 100%; border-right: 1px solid #ccc; background-color: #e9e9e9; padding: 10px; box-sizing: border-box; overflow-y: auto; }
        #build-area-container { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        #build-area { flex-grow: 1; background-color: #fff; position: relative; overflow: hidden; }
        #stats-panel { width: 100%; height: 80px; border-top: 1px solid #ccc; background-color: #f8f8f8; padding: 10px; box-sizing: border-box; display: flex; justify-content: space-around; align-items: center; }
        #stats-panel div { text-align: center; }
        #arena { width: 100%; height: 100%; background-color: #d0d0d0; position: relative; } /* Added position relative for message */
        #battle-mode { display: none; }
        .component-item { position: relative; padding: 8px; margin-bottom: 5px; background-color: #ddd; border: 1px solid #bbb; cursor: grab; text-align: center; font-size: 0.9em; display: flex; flex-direction: column; align-items: center; }
        .component-icon { font-size: 1.5em; margin-bottom: 4px; }
        .component-name { font-weight: bold; }
        .component-tooltip { display: none; position: absolute; left: 105%; top: 0; width: 150px; background-color: #333; color: #fff; border: 1px solid #000; padding: 8px; border-radius: 4px; font-size: 0.85em; text-align: left; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .component-item:hover .component-tooltip { display: block; }
        #start-battle-button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; transition: background-color 0.3s; }
        #start-battle-button:hover { background-color: #45a049; }
        #start-battle-button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>Bot Forge & Fight</h1>
    <div id="game-container">
        <div id="builder-mode">
            <div id="component-palette"><h2>Components</h2></div>
            <div id="build-area-container">
                <div id="build-area"></div>
                <div id="stats-panel">
                    <div><strong>Total Weight:</strong> <span id="total-weight">0</span> kg</div>
                    <div><strong>Power:</strong> <span id="power-usage">0</span> / <span id="power-capacity">0</span> W</div>
                    <div><strong>Components:</strong> <span id="component-count">0</span></div>
                    <button id="start-battle-button">Start Battle!</button>
                </div>
            </div>
        </div>
        <div id="battle-mode"><div id="arena"></div></div>
    </div>

    <script type="module">
        const { Engine, Render, Runner, World, Bodies, Composite, Body, Constraint, Events, Vector } = Matter;
        let currentMode = 'builder';
        let placedComponents = [];
        const GRID_SIZE = 50;
        let isFirstComponentPlaced = false;
        const MAX_WEIGHT = 500;
        let playerBotComposite = null;
        let playerBattleBot = null;
        let aiOpponentBot = null;
        const AI_MOTOR_FORCE = 0.004;
        const AI_ATTACK_RANGE = 200;
        const AI_WEAPON_COOLDOWN = 2000;
        let aiLastWeaponFireTime = 0;
        let isGameOver = false;

        const controlState = { forward: false, backward: false, left: false, right: false, action1: false };
        const MOTOR_FORCE = 0.005;

        const componentTypes = { CORE: 'core', STRUCTURE: 'structure', MOVEMENT: 'movement', POWER: 'power', WEAPON: 'weapon', UTILITY: 'utility' };
        class GameComponent {
            constructor(name, type, mass, durability, powerDraw = 0, icon = '⚙️') {
                this.id = name.toLowerCase().replace(/\s+/g, '-'); this.name = name; this.type = type; this.mass = mass;
                this.durability = durability; this.powerDraw = powerDraw; this.icon = icon; this.width = 50; this.height = 50; this.color = '#cccccc';
            }
        }
        class ControlUnit extends GameComponent { constructor(n,m,d,pC,i='🧠') { super(n,componentTypes.CORE,m,d,0,i); this.powerCapacity=pC;this.width=60;this.height=60;this.color='#4CAF50';}}
        class StructureComponent extends GameComponent { constructor(n,m,d,i,c='#A1887F') { super(n,componentTypes.STRUCTURE,m,d,0,i);this.color=c;}}
        class MovementComponent extends GameComponent { constructor(n,m,d,pD,i,c='#03A9F4') { super(n,componentTypes.MOVEMENT,m,d,pD,i);this.color=c;}}
        class MotorComponent extends MovementComponent { constructor(n,m,d,pD,t,i='⚡',c='#0288D1') {super(n,m,d,pD,i,c);this.torque=t;}}
        class PowerComponent extends GameComponent { constructor(n,m,d,pC,i,c='#FFC107') {super(n,componentTypes.POWER,m,d,0,i);this.powerCapacity=pC;this.color=c;}}
        class WeaponComponent extends GameComponent { constructor(n,m,d,pD,dmg,i,c='#F44336'){super(n,componentTypes.WEAPON,m,d,pD,i);this.damage=dmg;this.requiresMotor=false;this.requiresServo=false;this.color=c;}}

        const AVAILABLE_COMPONENTS = [
            new ControlUnit('Control Unit', 10, 100, 500), new StructureComponent('Metal Beam', 15, 120, '⛓️', '#B0BEC5'),
            new MovementComponent('Small Wheel', 3, 40, 20, '⚙️', '#29B6F6'), new MotorComponent('Electric Motor', 5, 50, 0, 100, '⚡'),
            new PowerComponent('Small Battery', 8, 30, 250, '🔋', '#FFEB3B'), new WeaponComponent('Drill Spike', 6, 70, 60, 10, '⛏️', '#EF5350'), // Increased drill damage
            new WeaponComponent('Spinner Blade', 12, 50, 150, 25, '🌀', '#D32F2F') // Increased spinner damage
        ];
        AVAILABLE_COMPONENTS.find(c=>c.name==='Drill Spike').requiresMotor=true; AVAILABLE_COMPONENTS.find(c=>c.name==='Spinner Blade').requiresMotor=true;
        window.AVAILABLE_COMPONENTS = AVAILABLE_COMPONENTS;

        const componentPalette = document.getElementById('component-palette');
        const buildAreaContainer = document.getElementById('build-area');
        const arenaContainer = document.getElementById('arena');
        const builderModeDiv = document.getElementById('builder-mode');
        const battleModeDiv = document.getElementById('battle-mode');
        let engine, render, runner;

        function setupBuilderEnvironment() {
            engine = Engine.create(); engine.world.gravity.y = 0;
            const { clientWidth: w, clientHeight: h } = buildAreaContainer;
            render = Render.create({ element: buildAreaContainer, engine, options: { width: w, height: h, wireframes: false, background: '#fff' } });
            Render.run(render); runner = Runner.create(); Runner.run(runner, engine);
            Events.on(render, 'afterRender', () => { const ctx = render.context; ctx.beginPath(); for (let x=0;x<=w;x+=GRID_SIZE){ctx.moveTo(x,0);ctx.lineTo(x,h);} for (let y=0;y<=h;y+=GRID_SIZE){ctx.moveTo(0,y);ctx.lineTo(w,y);} ctx.strokeStyle='#e0e0e0';ctx.stroke();});
        }

        function setupArenaEnvironment() {
            if (runner) Runner.stop(runner); if (render) { Render.stop(render); if (render.canvas) render.canvas.remove(); }
            engine = Engine.create();
            const { clientWidth: w, clientHeight: h } = arenaContainer;
            render = Render.create({ element: arenaContainer, engine, options: { width: w, height: h, wireframes: false, background: '#d0d0d0' } });
            Render.run(render); runner = Runner.create(); Runner.run(runner, engine);
            const wallT = 20; World.add(engine.world, [ Bodies.rectangle(w/2,0,w,wallT,{isStatic:true}), Bodies.rectangle(w/2,h,w,wallT,{isStatic:true}), Bodies.rectangle(0,h/2,wallT,h,{isStatic:true}), Bodies.rectangle(w,h/2,wallT,h,{isStatic:true}) ]);

            isGameOver = false;
            const oldGameOverMsg = document.getElementById('game-over-message');
            if (oldGameOverMsg) oldGameOverMsg.remove();

            playerBattleBot = addPlayerBotToArena(engine);
            aiOpponentBot = addAiBotToArena(engine);

            Events.on(engine, 'beforeUpdate', () => { applyPlayerControls(engine); updateAiOpponent(engine); });
            Events.on(engine, 'collisionStart', (event) => handleBattleCollisions(event, engine));
        }

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'builder') {
                builderModeDiv.style.display = 'flex'; battleModeDiv.style.display = 'none';
                if (render && render.canvas && render.canvas.parentElement === arenaContainer) { Render.stop(render); if (render.canvas) render.canvas.remove(); }
                playerBattleBot = null; aiOpponentBot = null; isGameOver = false;
                const oldGameOverMsg = document.getElementById('game-over-message'); if (oldGameOverMsg) oldGameOverMsg.remove(); // Clear message on returning to builder
                if (playerBotComposite) {} playerBotComposite = null;
                placedComponents.forEach(p => { p.body = null; p.battleBody = null; }); placedComponents = []; isFirstComponentPlaced = false;
                setupBuilderEnvironment(); updatePlayerBotComposite(); updateStatsPanel();
            } else if (mode === 'battle') {
                builderModeDiv.style.display = 'none'; battleModeDiv.style.display = 'flex';
                if (render && render.canvas && render.canvas.parentElement === buildAreaContainer) { Render.stop(render); if (render.canvas) render.canvas.remove(); }
                setupArenaEnvironment();
            }
        }

        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
        function handleDrop(e) {
            e.preventDefault(); const id=e.dataTransfer.getData('text/plain'); const comp=AVAILABLE_COMPONENTS.find(c=>c.id===id); if(!comp)return;
            const rect = buildAreaContainer.getBoundingClientRect(); const x=e.clientX-rect.left, y=e.clientY-rect.top; const gx=Math.floor(x/GRID_SIZE), gy=Math.floor(y/GRID_SIZE);
            if(!isFirstComponentPlaced && comp.type!==componentTypes.CORE){alert('Core first!');return;} if(isOccupied(gx,gy,comp)){alert('Occupied!');return;}
            if(isFirstComponentPlaced && placedComponents.length>0 && !isAdjacentToExisting(gx,gy,comp)){alert('Connect parts!');return;}
            const tempStats=calculateBotStats([...placedComponents,{component:comp}]); if(tempStats.totalWeight>MAX_WEIGHT){alert('Too heavy!');return;}
            if(tempStats.currentPowerUsage > tempStats.currentPowerCapacity && comp.type!==componentTypes.POWER && comp.type!==componentTypes.CORE){alert('Power deficit!');return;}
            const pInfo={id:`p-${comp.id}-${Date.now()}`,component:comp,gridX:gx,gridY:gy,x:gx*GRID_SIZE,y:gy*GRID_SIZE,width:comp.width||GRID_SIZE,height:comp.height||GRID_SIZE};
            placedComponents.push(pInfo); if(!isFirstComponentPlaced&&comp.type===componentTypes.CORE)isFirstComponentPlaced=true;
            updatePlayerBotComposite(); updateStatsPanel();
        }
        function isOccupied(gx,gy,comp){const cw=Math.ceil((comp.width||GRID_SIZE)/GRID_SIZE),ch=Math.ceil((comp.height||GRID_SIZE)/GRID_SIZE);for(const p of placedComponents){const pw=Math.ceil((p.component.width||GRID_SIZE)/GRID_SIZE),ph=Math.ceil((p.component.height||GRID_SIZE)/GRID_SIZE);if(gx<p.gridX+pw&&gx+cw>p.gridX&&gy<p.gridY+ph&&gy+ch>p.gridY)return true;}return false;}
        function isAdjacentToExisting(gx,gy,comp){if(placedComponents.length===0)return true;const cw=Math.ceil((comp.width||GRID_SIZE)/GRID_SIZE),ch=Math.ceil((comp.height||GRID_SIZE)/GRID_SIZE);for(const p of placedComponents){const pw=Math.ceil((p.component.width||GRID_SIZE)/GRID_SIZE),ph=Math.ceil((p.component.height||GRID_SIZE)/GRID_SIZE);const horz=(gx<p.gridX+pw&&gx+cw>p.gridX);if(horz&&(gy+ch===p.gridY||gy===p.gridY+ph))return true;const vert=(gy<p.gridY+ph&&gy+ch>p.gridY);if(vert&&(gx+cw===p.gridX||gx===p.gridX+pw))return true;}return false;}

        function updatePlayerBotComposite() {
            if(!engine)return; if(playerBotComposite)World.remove(engine.world,playerBotComposite); playerBotComposite=Composite.create({label:'PlayerBot'});
            const btn=document.getElementById('start-battle-button'); if(placedComponents.length===0){if(btn)btn.disabled=true;return;}
            placedComponents.forEach(p=>{const body=Bodies.rectangle(p.x+p.width/2,p.y+p.height/2,p.width,p.height,{label:p.component.name,render:{fillStyle:p.component.color}});Body.setMass(body,p.component.mass);body.componentData=JSON.parse(JSON.stringify(p.component));if(p.component.type===componentTypes.CORE)body.isCore=true;p.body=body;Composite.add(playerBotComposite,body);});
            for(let i=0;i<placedComponents.length;i++)for(let j=i+1;j<placedComponents.length;j++){const pA=placedComponents[i],pB=placedComponents[j];if(pA.body&&pB.body&&areComponentsPhysicallyTouching(pA,pB)){if(!playerBotComposite.constraints.find(c=>(c.bodyA===pA.body&&c.bodyB===pB.body)||(c.bodyB===pA.body&&c.bodyA===pB.body)))Composite.add(playerBotComposite,Constraint.create({bodyA:pA.body,bodyB:pB.body,stiffness:0.7,length:0,render:{visible:true,strokeStyle:'#55F'}}));}}
            if(playerBotComposite.bodies.length>0){World.add(engine.world,playerBotComposite);playerBotComposite.bodies.forEach(b=>Body.setStatic(b,true));}
            if(btn)btn.disabled=!placedComponents.some(p=>p.component.type===componentTypes.CORE)||placedComponents.length===0;
        }

        function getComponentById(id) { return AVAILABLE_COMPONENTS.find(c => c.id === id); }
        function createAiBotStructure() {
            const aiStruct = [ { componentId: 'control-unit', x: 1, y: 1, isCore: true }, { componentId: 'metal-beam', x: 1, y: 0 }, { componentId: 'metal-beam', x: 0, y: 1 }, { componentId: 'metal-beam', x: 2, y: 1 }, { componentId: 'metal-beam', x: 1, y: 2 }, { componentId: 'electric-motor', x: 0, y: 0 }, { componentId: 'small-wheel', x: 0, y: -1 }, { componentId: 'electric-motor', x: 2, y: 0 }, { componentId: 'small-wheel', x: 2, y: -1 }, { componentId: 'electric-motor', x: 0, y: 2 }, { componentId: 'small-wheel', x: 0, y: 3 }, { componentId: 'electric-motor', x: 2, y: 2 }, { componentId: 'small-wheel', x: 2, y: 3 }, { componentId: 'drill-spike', x: 1, y: -1 } ];
            return aiStruct.map((item,idx)=>{const comp=getComponentById(item.componentId);if(!comp)return null;return{id:`ai-${idx}-${comp.id}`,component:comp,gridX:item.x,gridY:item.y,x:item.x*GRID_SIZE,y:item.y*GRID_SIZE,width:comp.width||GRID_SIZE,height:comp.height||GRID_SIZE,isCore:item.isCore||false};}).filter(i=>i!==null);
        }
        function addBotToArena(botDesign, label, startX, arenaEngine, strokeStyle = '#AA0000') {
            if (botDesign.length === 0) return null;
            const botComposite = Composite.create({ label });
            let minX = Infinity, minY = Infinity, totalMass = 0, sumX = 0, sumY = 0;
            botDesign.forEach(p => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); totalMass += p.component.mass; });
            botDesign.forEach(p => {
                const comp = p.component; const localX = p.x-minX, localY = p.y-minY;
                const body = Bodies.rectangle(localX+p.width/2, localY+p.height/2, p.width, p.height, { label:label+"_"+comp.name, restitution:0.1, friction:0.7, frictionAir:0.02, density:comp.mass/(p.width*p.height), render:{fillStyle:comp.color,strokeStyle,lineWidth:2}});
                body.componentData = JSON.parse(JSON.stringify(comp)); // Deep copy for mutable durability
                if (typeof body.componentData.durability === 'undefined') body.componentData.durability = comp.durability || 50;
                if(p.isCore) body.isCore=true; p.battleBody=body; Composite.add(botComposite,body);
                sumX+=(localX+p.width/2)*comp.mass; sumY+=(localY+p.height/2)*comp.mass;
            });
            for(let i=0;i<botDesign.length;i++)for(let j=i+1;j<botDesign.length;j++){const pA=botDesign[i],pB=botDesign[j];if(pA.battleBody&&pB.battleBody&&areComponentsPhysicallyTouching(pA,pB))Composite.add(botComposite,Constraint.create({bodyA:pA.battleBody,bodyB:pB.battleBody,stiffness:0.8,length:0,render:{visible:false}}));}
            Composite.translate(botComposite,{x:startX-(totalMass>0?sumX/totalMass:0),y:(arenaContainer.clientHeight/2)-(totalMass>0?sumY/totalMass:0)});
            World.add(arenaEngine.world, botComposite); return botComposite;
        }
        function addPlayerBotToArena(arenaEng) { return addBotToArena(placedComponents, 'PlayerBattleBot', 150, arenaEng, '#333333'); }
        function addAiBotToArena(arenaEng) { return addBotToArena(createAiBotStructure(), 'AIOpponentBot', arenaContainer.clientWidth - 150, arenaEng); }

        function areComponentsPhysicallyTouching(pA,pB){const bA={L:pA.x,R:pA.x+pA.width,T:pA.y,B:pA.y+pA.height};const bB={L:pB.x,R:pB.x+pB.width,T:pB.y,B:pB.y+pB.height};const pr=1;const horz=(Math.abs(bA.R-bB.L)<pr||Math.abs(bA.L-bB.R)<pr)&&(bA.T<bB.B-pr&&bA.B>bB.T+pr);const vert=(Math.abs(bA.B-bB.T)<pr||Math.abs(bA.T-bB.B)<pr)&&(bA.L<bB.R-pr&&bA.R>bB.L+pr);return horz||vert;}
        function calculateBotStats(compList){let tW=0,cPU=0,cPC=0;compList.forEach(p=>{const c=p.component;tW+=c.mass;cPU+=c.powerDraw;if(c.powerCapacity)cPC+=c.powerCapacity;});return{totalWeight:tW,currentPowerUsage:cPU,currentPowerCapacity:cPC,componentCount:compList.length};}
        function updateStatsPanel(){const s=calculateBotStats(placedComponents);const twEl=document.getElementById('total-weight'),puEl=document.getElementById('power-usage'),pcEl=document.getElementById('power-capacity'),ccEl=document.getElementById('component-count');if(twEl)twEl.textContent=s.totalWeight.toFixed(1);if(puEl)puEl.textContent=s.currentPowerUsage;if(pcEl)pcEl.textContent=s.currentPowerCapacity;if(ccEl)ccEl.textContent=s.componentCount;const twN=twEl?.parentNode,puN=puEl?.parentNode;if(twN)twN.style.color=s.totalWeight>MAX_WEIGHT?'red':'black';if(puN)puN.style.color=s.currentPowerUsage>s.currentPowerCapacity?'red':'black';}

        function handleKeyDown(e){if(isGameOver||currentMode!=='battle')return;switch(e.key.toLowerCase()){case 'w':case 'arrowup':controlState.forward=true;break;case 's':case 'arrowdown':controlState.backward=true;break;case 'a':case 'arrowleft':controlState.left=true;break;case 'd':case 'arrowright':controlState.right=true;break;case ' ':case 'j':controlState.action1=true;break;}}
        function handleKeyUp(e){if(isGameOver||currentMode!=='battle')return;switch(e.key.toLowerCase()){case 'w':case 'arrowup':controlState.forward=false;break;case 's':case 'arrowdown':controlState.backward=false;break;case 'a':case 'arrowleft':controlState.left=false;break;case 'd':case 'arrowright':controlState.right=false;break;case ' ':case 'j':controlState.action1=false;break;}}

        function applyPlayerControls(eng){
            if(isGameOver||!playerBattleBot||currentMode!=='battle'||!eng)return; const bodies=Composite.allBodies(playerBattleBot),constraints=Composite.allConstraints(playerBattleBot),core=bodies.find(b=>b.isCore);
            const motors=bodies.filter(b=>b.componentData?.type===componentTypes.MOVEMENT&&b.componentData?.torque);
            motors.forEach(motor=>{constraints.forEach(constraint=>{let wheel=null;if(constraint.bodyA===motor&&constraint.bodyB.componentData?.name?.includes('Wheel'))wheel=constraint.bodyB;else if(constraint.bodyB===motor&&constraint.bodyA.componentData?.name?.includes('Wheel'))wheel=constraint.bodyA;if(wheel){const wheelAngle=wheel.angle,forceMag=MOTOR_FORCE*wheel.mass,fVec={x:Math.cos(wheelAngle-Math.PI/2),y:Math.sin(wheelAngle-Math.PI/2)};if(controlState.forward)Body.applyForce(wheel,wheel.position,{x:fVec.x*forceMag,y:fVec.y*forceMag});if(controlState.backward)Body.applyForce(wheel,wheel.position,{x:-fVec.x*forceMag,y:-fVec.y*forceMag});}});});
            if(core){const turnTorque=0.0005*Composite.inertia(playerBattleBot);if(controlState.left)Body.applyTorque(core,-turnTorque);if(controlState.right)Body.applyTorque(core,turnTorque);}
            if(controlState.action1){bodies.filter(b=>b.componentData?.type===componentTypes.WEAPON).forEach(w=>{if(w.componentData.name==='Spinner Blade')Body.setAngularVelocity(w,0.5);else if(w.componentData.name==='Drill Spike'&&core){const dfm=0.01*w.mass,dA=w.angle;Body.applyForce(core,w.position,{x:Math.cos(dA-Math.PI/2)*dfm,y:Math.sin(dA-Math.PI/2)*dfm});}});}}

        function updateAiOpponent(eng) {
            if (isGameOver||!aiOpponentBot||!playerBattleBot||currentMode!=='battle'||!eng)return;
            const aiCore=Composite.allBodies(aiOpponentBot).find(b=>b.isCore),playerCore=Composite.allBodies(playerBattleBot).find(b=>b.isCore); if(!aiCore||!playerCore)return;
            const dirToPlayer=Vector.sub(playerCore.position,aiCore.position),distToPlayer=Vector.magnitude(dirToPlayer),normDirToPlayer=Vector.normalise(dirToPlayer);
            const aiMotors=Composite.allBodies(aiOpponentBot).filter(b=>b.componentData?.type===componentTypes.MOVEMENT&&b.componentData?.torque),aiWheels=Composite.allBodies(aiOpponentBot).filter(b=>b.componentData?.name?.includes('Wheel')),aiConstraints=Composite.allConstraints(aiOpponentBot);
            aiMotors.forEach(motor=>{aiConstraints.forEach(constraint=>{let wheel=null;if(constraint.bodyA===motor&&aiWheels.includes(constraint.bodyB))wheel=constraint.bodyB;else if(constraint.bodyB===motor&&aiWheels.includes(constraint.bodyA))wheel=constraint.bodyA;if(wheel){const wheelAngle=wheel.angle,fwdVec={x:Math.cos(wheelAngle-Math.PI/2),y:Math.sin(wheelAngle-Math.PI/2)},dot=Vector.dot(fwdVec,normDirToPlayer);if(dot>0.3)Body.applyForce(wheel,wheel.position,Vector.mult(fwdVec,AI_MOTOR_FORCE*wheel.mass));const desiredAngle=Math.atan2(normDirToPlayer.y,normDirToPlayer.x);let angleDiff=desiredAngle-(aiCore.angle-Math.PI/2);while(angleDiff>Math.PI)angleDiff-=2*Math.PI;while(angleDiff<-Math.PI)angleDiff+=2*Math.PI;if(Math.abs(angleDiff)>0.1)Body.applyTorque(aiCore,angleDiff>0?(0.0003*Composite.inertia(aiOpponentBot)):(-0.0003*Composite.inertia(aiOpponentBot)));}});});
            if(distToPlayer<AI_ATTACK_RANGE&&(Date.now()-aiLastWeaponFireTime>AI_WEAPON_COOLDOWN)){Composite.allBodies(aiOpponentBot).filter(b=>b.componentData?.type===componentTypes.WEAPON).forEach(w=>{if(w.componentData.name==='Drill Spike')Body.applyForce(aiCore,w.position,Vector.mult(normDirToPlayer,0.02*w.mass));});aiLastWeaponFireTime=Date.now();}
        }

        function handleBattleCollisions(event, engine) {
            if (isGameOver) return; const pairs = event.pairs;
            pairs.forEach(pair => {
                const {bodyA, bodyB} = pair;
                const botA = getBotRootComposite(bodyA, playerBattleBot, aiOpponentBot);
                const botB = getBotRootComposite(bodyB, playerBattleBot, aiOpponentBot);
                if (!bodyA.componentData || !bodyB.componentData || !botA || !botB || botA === botB) return;
                let attackerBody=null,victimBody=null,victimBot=null;
                if (bodyA.componentData.type===componentTypes.WEAPON&&botA!==botB){attackerBody=bodyA;victimBody=bodyB;victimBot=botB;}
                else if(bodyB.componentData.type===componentTypes.WEAPON&&botB!==botA){attackerBody=bodyB;victimBody=bodyA;victimBot=botA;}
                if(attackerBody&&victimBody){
                    const weaponData=attackerBody.componentData,victimData=victimBody.componentData,damage=weaponData.damage||5;
                    if(victimData.durability>0){ victimData.durability-=damage;
                        if(victimData.durability<=0){victimData.durability=0;victimBody.render.fillStyle='#555';victimBody.render.strokeStyle='#222';
                            if(victimData.type===componentTypes.CORE){isGameOver=true;Runner.stop(runner);let winnerMsg=(victimBot===playerBattleBot)?"AI Wins!":"Player Wins!";displayGameOverMessage(winnerMsg);}
                        }
                    }
                }
            });
        }
        function getBotRootComposite(body, pBot, aiBot) {
            if(!body||!body.parent)return null;let current=body.parent;
            while(current!==current.parent){if(current===pBot)return pBot;if(current===aiBot)return aiBot;current=current.parent;}
            if(current===pBot)return pBot;if(current===aiBot)return aiBot;
            if(body===pBot)return pBot;if(body===aiBot)return aiBot; return null;
        }
        function displayGameOverMessage(message){
            const msgDiv=document.createElement('div');msgDiv.id='game-over-message';msgDiv.textContent=message;
            msgDiv.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:30px;background-color:rgba(0,0,0,0.8);color:white;font-size:2em;border:2px solid white;border-radius:10px;text-align:center;z-index:2000;';
            const btn=document.createElement('button');btn.textContent="Play Again (Builder)";btn.style.cssText='display:block;margin:20px auto 0 auto;padding:10px 15px;';
            btn.onclick=()=>window.location.reload();msgDiv.appendChild(btn);document.body.appendChild(msgDiv);
        }

        function init() {
            console.log("Init game..."); populateComponentPalette();
            buildAreaContainer.addEventListener('dragover',handleDragOver); buildAreaContainer.addEventListener('drop',handleDrop);
            window.addEventListener('keydown',handleKeyDown); window.addEventListener('keyup',handleKeyUp);
            setupBuilderEnvironment(); updatePlayerBotComposite(); updateStatsPanel();
            const sbBtn=document.getElementById('start-battle-button');
            if(sbBtn){sbBtn.addEventListener('click',()=>{if(!placedComponents.some(p=>p.component.type===componentTypes.CORE)){alert('CPU missing!');return;}if(placedComponents.length===0){alert('Empty bot!');return;}const s=calculateBotStats(placedComponents);if(s.totalWeight>MAX_WEIGHT){alert('Too heavy!');return;}if(s.currentPowerUsage>s.currentPowerCapacity){alert('Power deficit!');return;}switchMode('battle');});sbBtn.disabled=!placedComponents.some(p=>p.component.type===componentTypes.CORE)||placedComponents.length===0;}else console.error('Start Battle button missing!');
            const devBattleBtn=document.createElement('button');devBattleBtn.textContent='DEV:Battle';devBattleBtn.style.cssText='position:absolute;top:10px;right:10px;z-index:1000;padding:5px;background-color:lightcoral;';devBattleBtn.onclick=()=>switchMode('battle');document.body.appendChild(devBattleBtn);
            const devBuildBtn=document.createElement('button');devBuildBtn.textContent='DEV:Builder';devBuildBtn.style.cssText='position:absolute;top:40px;right:10px;z-index:1000;padding:5px;background-color:lightgreen;';devBuildBtn.onclick=()=>switchMode('builder');document.body.appendChild(devBuildBtn);
        }
        function populateComponentPalette(){if(!componentPalette||!AVAILABLE_COMPONENTS)return;componentPalette.innerHTML='<h2>Components</h2>';AVAILABLE_COMPONENTS.forEach(c=>{const i=document.createElement('div');i.className='component-item';i.draggable=true;i.dataset.componentId=c.id;i.innerHTML=`<span class="component-icon">${c.icon}</span><span class.component-name">${c.name}</span><div class="component-tooltip">Mass:${c.mass}kg<br>HP:${c.durability}<br>${c.powerDraw>0?`Draw:${c.powerDraw}W<br>`:''}${c.powerCapacity>0?`Cap:${c.powerCapacity}W<br>`:''}${c.torque>0?`Torque:${c.torque}<br>`:''}${c.damage>0?`Dmg:${c.damage}<br>`:''}Type:${c.type}</div>`;i.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.id);e.dataTransfer.effectAllowed='copy';});componentPalette.appendChild(i);});}
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
